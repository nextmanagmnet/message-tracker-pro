<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WhatsApp</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#111}a{background:#25D366;color:#fff;padding:14px 28px;border-radius:10px;font-weight:600;text-decoration:none}</style>
</head>
<body>
<a id="wa" href="#">WhatsApp</a>
<script>
// Bridge for website-destination ads: TikTok needs a real web URL (it rejects wa.me once a pixel is on)
// and appends ?ttclid=... to it. Fold the click id and campaign id into the WhatsApp message and hand over.
// The client's pixel (px=) runs here, so users never paste pixel code anywhere: PageView + ClickButton
// per ad click give TikTok enough events to learn; WOB's server sends Contact / SubmitForm / Purchase later.
// /go.html?to=<digits>&text=<message>&px=<pixel code>&cid=__CAMPAIGN_ID__
function whatsappUrl(search) {
  var q = new URLSearchParams(search);
  var to = (q.get("to") || "").replace(/\D/g, "");
  if (to.length < 8) return null;
  var real = function (v) { return v && !/^__\w+__$/.test(v); };
  var parts = [q.get("text") || ""];
  if (real(q.get("ttclid"))) parts.push("ttclid=" + q.get("ttclid"));
  if (real(q.get("cid"))) parts.push("cid=" + q.get("cid"));
  return "https://wa.me/" + to + "?text=" + encodeURIComponent(parts.join(" ").trim());
}

function loadPixel(code) {
  // TikTok's standard base code, with the pixel id passed in.
  !function (w, d, t) {
    w.TiktokAnalyticsObject = t; var ttq = w[t] = w[t] || [];
    ttq.methods = ["page", "track", "identify", "instances", "debug", "on", "off", "once", "ready", "alias", "group", "enableCookie", "disableCookie", "holdConsent", "revokeConsent", "grantConsent"];
    ttq.setAndDefer = function (t, e) { t[e] = function () { t.push([e].concat(Array.prototype.slice.call(arguments, 0))) } };
    for (var i = 0; i < ttq.methods.length; i++) ttq.setAndDefer(ttq, ttq.methods[i]);
    ttq.instance = function (t) { for (var e = ttq._i[t] || [], n = 0; n < ttq.methods.length; n++) ttq.setAndDefer(e, ttq.methods[n]); return e };
    ttq.load = function (e, n) {
      var r = "https://analytics.tiktok.com/i18n/pixel/events.js";
      ttq._i = ttq._i || {}, ttq._i[e] = [], ttq._i[e]._u = r, ttq._t = ttq._t || {}, ttq._t[e] = +new Date, ttq._o = ttq._o || {}, ttq._o[e] = n || {};
      n = d.createElement("script"); n.type = "text/javascript", n.async = !0, n.src = r + "?sdkid=" + e + "&lib=" + t;
      e = d.getElementsByTagName("script")[0]; e.parentNode.insertBefore(n, e);
    };
    ttq.load(code); ttq.page(); ttq.track("ClickButton", { content_name: "whatsapp" });
  }(window, document, "ttq");
}

var url = whatsappUrl(location.search);
var px = new URLSearchParams(location.search).get("px");
if (!url) document.body.textContent = "Invalid link";
else {
  document.getElementById("wa").href = url;
  var go = function () { location.replace(url); };
  if (px && /^[A-Z0-9]{10,30}$/.test(px)) {
    loadPixel(px);
    // ponytail: fixed wait for the pixel to send; ~1s is the cost of a tracked click.
    setTimeout(go, 900);
  } else go();
}
</script>
</body>
</html>
