<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOB — World of Business</title>
    <meta
      name="description"
      content="WOB counts the people who actually message you on WhatsApp from your TikTok and Meta ads, and reports qualified leads and clients back to the ad platforms."
    />
    <meta name="author" content="WOB — World of Business" />
    <meta name="theme-color" content="#050505" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <meta property="og:title" content="WOB — World of Business" />
    <meta
      property="og:description"
      content="Turn ad clicks into real WhatsApp conversations, qualified leads and clients."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/favicon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WOB — World of Business" />
    <meta name="twitter:image" content="/brand/favicon-512.png" />

    <script>
      // Apply saved theme/language before first paint to avoid a flash.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem("wob-theme");
          if (theme === "light") root.classList.remove("dark");
          var lang = localStorage.getItem("wob-lang");
          if (lang === "ar") {
            root.lang = "ar";
            root.dir = "rtl";
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
